  $("rnd").textContent = P.round;
  const pot = $("pot"); pot.hidden = !P.pot.length; pot.textContent = `Pot ${P.pot.length}`;
  $("pYou").classList.toggle("active", P.turn === "you");
  $("pThem").classList.toggle("active", P.turn === "opp");
  if (bump) { const el = bump === "you" ? $("cYou") : $("cThem"); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}

function pTimer(who) {
  cancelAnimationFrame(pRaf);
  const id = who === "you" ? "ringYou" : "ringThem";
  ["ringYou", "ringThem"].forEach(r => { const el = $(r); if (el) { el.querySelector(".fg").style.strokeDashoffset = "0"; el.classList.remove("urgent"); } });
  if (!practiceSecs) return;
  const dur = practiceSecs * 1000, t0 = performance.now(), g = pGen;
  let shown = -1;
  const tickP = now => {
    if (g !== pGen || !P || P.phase !== "choose") return;
    const left = Math.max(0, dur - (now - t0)), urgent = left <= 5000;
    const ring = $(id); if (ring) { ring.querySelector(".fg").style.strokeDashoffset = (100 * (1 - left / dur)).toFixed(2); ring.classList.toggle("urgent", urgent); }
    if (who === "you") {
      const s = Math.ceil(left / 1000), el = $("secs");
      if (el && s !== shown) {
        shown = s; el.textContent = s + "s";
        if (urgent) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
        const pill = $("pill"); if (pill) { pill.classList.toggle("hurry", urgent); pill.classList.toggle("turn", !urgent); }
      }
      if (left <= 0) { pResolve(Math.floor(Math.random() * P.d.stats.length), true); return; }
    }
    pRaf = requestAnimationFrame(tickP);
  };
  pRaf = requestAnimationFrame(tickP);
}

function pRound() {
  P.phase = "choose"; P.stat = null; P.result = null;
  pBoard(null);
  const yours = P.turn === "you";
  $("table").className = "table";
  $("table").innerHTML = `
    <div class="slot you deal" id="sYou">${cardHTML(P.d, P.you[0], "you", yours)}</div>
    <div class="vs" aria-hidden="true">VS</div>
    <div class="slot them deal" id="sThem"><div class="flipper">
      <div class="face back">${backHTML(yours ? "Face down" : `Picking<span class="dots"><i></i><i></i><i></i></span>`, !yours)}</div>
      <div class="face front" id="front" aria-hidden="true">${cardHTML(P.d, P.opp[0], "them", false)}</div>
    </div></div>`;
  $("actions").innerHTML = "";
  if (yours) {
    setStatus("turn", `<b>Your turn</b> <span class="sep">·</span> pick a stat${practiceSecs ? ` <span class="secs" id="secs">${practiceSecs}s</span>` : ""}`);
    $("table").querySelectorAll("button.row").forEach(b => b.onclick = () => pResolve(+b.dataset.i));
  } else {
    setStatus("wait", `<b>${BOT}'s turn</b> <span class="sep">·</span> ${P.round === 1 ? "picks first" : "won last round"}`, `<span class="mini">C</span>`);
    $("sYou").querySelector(".stats").classList.add("waiting");
    const cap = practiceSecs ? practiceSecs * 1000 - 600 : 4000;
    pLater(Math.min(cap, 1300 + Math.random() * 1500), () => pResolve(pBotPick()));
  }
  pTimer(P.turn);
}

function pBotPick() {
  const c = P.opp[0];
  if (Math.random() < .2) return Math.floor(Math.random() * P.d.stats.length);
  let best = 0, top = -1;
  P.d.stats.forEach((_, i) => { const sc = strength(P.d, i, c.v[i]); if (sc > top) { top = sc; best = i; } });
  return best;
}

function pResolve(i, auto) {
  if (!P || P.phase !== "choose") return;
  cancelAnimationFrame(pRaf);
  P.phase = "reveal"; P.stat = i;
  const s = P.d.stats[i], a = P.you[0].v[i], b = P.opp[0].v[i];
  P.result = a === b ? "draw" : (s.low ? a < b : a > b) ? "win" : "lose";
  P.rounds++; if (P.result === "win") P.wins++;
  const by = P.turn;
  ["ringYou", "ringThem"].forEach(r => $(r)?.classList.remove("urgent"));
  const sYou = $("sYou"), sThem = $("sThem");
  sYou.querySelectorAll("button.row").forEach(btn => btn.disabled = true);
  const ys = sYou.querySelector(".stats"); ys.classList.remove("prompt", "waiting"); ys.classList.add("decided"); ys.querySelector(`[data-i="${i}"]`).classList.add("picked");
  const ts = sThem.querySelector(".front .stats"); ts.classList.add("decided"); ts.querySelector(`[data-i="${i}"]`).classList.add("picked");
  $("actions").innerHTML = "";
  if (auto) setStatus("hurry", `<b>Time's up</b> <span class="sep">·</span> ${esc(s.label)} was played for you`);
  else if (by === "you") setStatus("wait", `You played <b>${esc(s.label)}</b>`);
  else setStatus("wait", `${BOT} picked <b>${esc(s.label)}</b>`, `<span class="mini">C</span>`);
  $("cardBack")?.classList.remove("thinking");
  $("front").removeAttribute("aria-hidden");
  pLater(by === "you" && !auto ? 160 : 700, () => sThem.classList.add("flipped"));
  pLater(by === "you" && !auto ? 900 : 1450, pShowResult);
}

function pShowResult() {
  if (!P || P.phase !== "reveal") return;
  const i = P.stat, s = P.d.stats[i], res = P.result;
  const yRow = $("sYou").querySelector(`[data-i="${i}"]`), tRow = $("sThem").querySelector(`.front [data-i="${i}"]`);
  const yCard = $("sYou").querySelector(".card"), tCard = $("sThem").querySelector(".front .card");
  const a = fmt(P.you[0].v[i]), b = fmt(P.opp[0].v[i]), sep = `<span class="sep">·</span>`;
  if (res === "draw") { yRow.classList.add("draw"); tRow.classList.add("draw"); setStatus("draw", `<b>${esc(s.label)}</b> tied at ${a} ${sep} Both cards go in the pot`); }
  else {
    yRow.classList.add(res); tRow.classList.add(res === "win" ? "lose" : "win");
    (res === "win" ? yCard : tCard).classList.add("stamped"); (res === "win" ? tCard : yCard).classList.add("dim");
    setStatus(res, res === "win" ? `<b>${esc(s.label)}</b> ${a} v ${b} ${sep} You take ${esc(P.opp[0].name)}` : `<b>${esc(s.label)}</b> ${a} v ${b} ${sep} ${BOT} takes ${esc(P.you[0].name)}`);
  }
  const last = (res === "win" && P.opp.length === 1) || (res === "lose" && P.you.length === 1) || P.round >= 40;
  const nextPicker = res === "win" ? "you" : res === "lose" ? "opp" : P.turn;
  $("actions").innerHTML = `<button type="button" class="btn primary" id="next">${last ? "See result" : nextPicker === "you" ? "Next round · you pick" : `Next round · ${BOT} picks`}${ARROW}</button>`;
  $("next").onclick = pNext;
  $("next").focus({ preventScroll: true });
  P.phase = "result";
}

function pNext() {
  if (!P || P.phase !== "result") return;
  P.phase = "moving";
  const res = P.result;
  $("actions").innerHTML = "";
  $("table").classList.add(res === "win" ? "to-you" : res === "lose" ? "to-them" : "to-pot");
  pLater(480, () => {
    const y = P.you.shift(), o = P.opp.shift();
    let bump = null;
    if (res === "draw") P.pot.push(y, o);
    else if (res === "win") { P.you.push(y, o, ...P.pot); P.pot = []; P.turn = "you"; bump = "you"; }
    else { P.opp.push(o, y, ...P.pot); P.pot = []; P.turn = "opp"; bump = "opp"; }
    P.round++;
    if (!P.you.length || !P.opp.length || P.round > 40) return pOver();
    pBoard(bump);
    pRound();
  });
}

function pOver() {
  const y = P.you.length, o = P.opp.length, total = P.d.cards.length, key = P.key, won = y > o, tie = y === o;
  const rounds = P.rounds, wins = P.wins;
  stopPractice();
  app.innerHTML = `
  <section class="over view">
    <div class="game-top"><button type="button" class="link" id="leave">${BACK}Home</button><span class="deck-label">${esc(DECKS[key].name)} · vs computer</span></div>
    <div class="result" style="--glow:${won ? "var(--accent)" : tie ? "var(--draw)" : "var(--them)"}">
      <p class="eyebrow">${esc(DECKS[key].name)} · ${rounds} round${rounds === 1 ? "" : "s"}</p>
      <h1>${won ? "You win" : tie ? "All square" : `${BOT} wins`}</h1>
      <div class="final"><div><span class="avatar">${ME}</span><b>${y}</b></div><span class="dash">–</span><div><b>${o}</b><span class="avatar them">C</span></div></div>
      <div class="tug" aria-hidden="true"><i style="width:${y / total * 100}%"></i></div>
      <p>You won ${wins} of ${rounds} round${rounds === 1 ? "" : "s"}.</p>
      <div class="actions"><button type="button" class="btn primary" id="again">Play again${ARROW}</button><button type="button" class="btn ghost" id="home2">Home</button></div>
    </div>
  </section>`;
  $("again").onclick = () => startPractice(key);
  $("leave").onclick = $("home2").onclick = () => home();
}

document.addEventListener("keydown", e => {
  if (!P || e.metaKey || e.ctrlKey || e.altKey || (e.target.tagName || "").toLowerCase() === "input") return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (P.phase === "choose" && P.turn === "you" && /^[1-9]$/.test(e.key) && +e.key <= P.d.stats.length) { e.preventDefault(); pResolve(+e.key - 1); }
  else if (P.phase === "result" && (e.key === "Enter" || e.key === " ") && tag !== "button") { e.preventDefault(); pNext(); }
});

/* Pull down to refresh, in the installed app (browsers have their own) */
(function pullToRefresh() {
  const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
  if (!standalone || !("ontouchstart" in window)) return;
  const ind = document.createElement("div"); ind.className = "ptr"; ind.setAttribute("aria-hidden", "true"); ind.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.body.appendChild(ind);
  let y0 = null, x0 = 0, pull = 0, on = false, busyPtr = false;
  const blocked = t => t.closest && t.closest("input, textarea, select, .rate-track, .sp-photo, .confirm");
  addEventListener("touchstart", e => {
    y0 = null;
    if (busyPtr || window.scrollY > 2 || e.touches.length !== 1 || blocked(e.target)) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; pull = 0; on = false;
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0);
    if (!on) { if (dy > 10 && dy > dx * 1.6 && window.scrollY <= 2) on = true; else if (dy < -4 || dx > 14) { y0 = null; return; } else return; }
    pull = Math.min(120, dy * .5); ind.style.transition = "none";
    ind.style.transform = `translate(-50%, ${pull - 48}px) rotate(${pull * 3}deg)`;
    ind.style.opacity = Math.min(1, pull / 56);
    ind.classList.toggle("ready", pull >= 62);
  }, { passive: true });
  const end = async () => {
    if (y0 == null && !on) return;
    y0 = null;
    if (on && pull >= 62) {
      busyPtr = true; ind.style.transition = ""; ind.classList.add("spinning"); ind.style.transform = "translate(-50%, 14px)"; ind.style.opacity = 1;
      if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
      try { await pullRefresh(); } catch (e) {}
      busyPtr = false;
    }
    on = false; pull = 0; ind.style.transition = ""; ind.classList.remove("spinning", "ready"); ind.style.transform = ""; ind.style.opacity = 0;
  };
  addEventListener("touchend", end, { passive: true }); addEventListener("touchcancel", end, { passive: true });
})();
async function pullRefresh() {
  if (offline || !sb) { location.reload(); return new Promise(() => {}); }
  if (P || isLocal() || E) return;                      // practice and the deck editor are local: nothing to fetch
  if (gameId) { renderedKey = ""; return refresh(); }
  if (G) { await loadDraft(); if (G && G.d) renderDraft(true); return; }
  try { await loadDecks(); } catch (e) {}
  return home();
}

boot();

</script>
