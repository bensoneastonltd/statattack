<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }

/* Layout: one calm column. Lobby = hero + deck picker. Duel = players bar, status pill, two cards on a table, one action. */
:root {
  --bg: #f1f2f6;
  --surface: #ffffff;
  --surface-2: #f5f6f9;
  --line: #e2e5ec;
  --line-strong: #cdd2dd;
  --ink: #11141d;
  --muted: #666d7d;
  --accent: #ff5b36;
  --accent-ink: #ffffff;
  --accent-soft: #ffe7e0;
  --them: #5d6f96;
  --them-soft: #dfe4ef;
  --win: #11a05a;
  --win-soft: #e2f6ea;
  --lose: #e2484d;
  --lose-soft: #fde6e6;
  --draw: #c98f00;
  --draw-soft: #fbf0d2;
  --back: #1b1f2c;
  --shadow: 0 1px 2px rgba(17, 20, 29, .06), 0 14px 34px -20px rgba(17, 20, 29, .45);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(.2, .75, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e14; --surface: #161922; --surface-2: #1c202b; --line: #262b38; --line-strong: #353c4d; --ink: #eef0f6; --muted: #8d95a7;
    --accent: #ff7553; --accent-ink: #1a0b06; --accent-soft: #3b1f17; --them: #93a5cf; --them-soft: #263049;
    --win: #3fd68e; --win-soft: #13301f; --lose: #ff6b70; --lose-soft: #3a1a1c; --draw: #f2c14e; --draw-soft: #362c12;
    --back: #212638; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -22px rgba(0, 0, 0, .9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e14; --surface: #161922; --surface-2: #1c202b; --line: #262b38; --line-strong: #353c4d; --ink: #eef0f6; --muted: #8d95a7;
  --accent: #ff7553; --accent-ink: #1a0b06; --accent-soft: #3b1f17; --them: #93a5cf; --them-soft: #263049;
  --win: #3fd68e; --win-soft: #13301f; --lose: #ff6b70; --lose-soft: #3a1a1c; --draw: #f2c14e; --draw-soft: #362c12;
  --back: #212638; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -22px rgba(0, 0, 0, .9); color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 780px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand b { font-weight: inherit; color: var(--accent); }
.brand-mark { width: 28px; height: 28px; position: relative; flex: none; }
.brand-mark i { position: absolute; width: 18px; height: 24px; border-radius: 5px; top: 2px; }
.brand-mark i:first-child { left: 0; background: var(--them); transform: rotate(-10deg); }
.brand-mark i:last-child { right: 0; background: var(--accent); transform: rotate(8deg); }
.tag { font-size: 11.5px; font-weight: 500; color: var(--muted); border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; }

.view { animation: viewIn .45s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }

/* Shared bits */
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 12.5px; color: #fff; background: var(--accent); transition: box-shadow .35s var(--ease); }
.avatar.them { background: linear-gradient(140deg, var(--them), color-mix(in srgb, var(--them) 60%, #000)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; border-radius: 999px; padding: 13px 24px; font-weight: 600; font-size: 15px; transition: transform .2s var(--ease), box-shadow .2s, background .2s; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 22px -10px var(--accent); }
.btn.primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -10px var(--accent); }
.btn.primary:active { transform: translateY(0) scale(.98); }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--line-strong); }
.btn svg { width: 16px; height: 16px; transition: transform .2s var(--ease); }
.btn:hover svg { transform: translateX(2px); }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

/* ---------- Card ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0;
  transition: opacity .35s var(--ease), transform .35s var(--ease);
}
.art {
  --h: 30;
  position: relative; aspect-ratio: 16 / 10; padding: 12px 12px 13px; display: flex; flex-direction: column; justify-content: space-between;
  color: #fff; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(110% 90% at 92% 0%, hsl(var(--h) 100% 72% / .95) 0%, transparent 55%),
    radial-gradient(80% 90% at 0% 100%, hsl(calc(var(--h) - 34) 82% 44%) 0%, transparent 62%),
    linear-gradient(155deg, hsl(var(--h) 82% 56%), hsl(calc(var(--h) - 22) 72% 30%));
}
.art::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 45%, rgba(0, 0, 0, .28)); }
.art-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.chip { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: rgba(0, 0, 0, .22); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.code { font-family: var(--f-data); font-size: 11px; opacity: .8; }
.stamp { display: none; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: #fff; color: #0f6b3d; }
.card.stamped .code { display: none; }
.card.stamped .stamp { display: inline-block; animation: pop .45s var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } }
.num { position: absolute; right: -6px; bottom: -26px; z-index: -1; font-family: var(--f-display); font-weight: 700; font-size: 104px; line-height: 1; opacity: .14; letter-spacing: -.05em; }
.art h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: clamp(14px, 3.1vw, 21px); line-height: 1.12; letter-spacing: -.015em; text-wrap: balance; text-shadow: 0 1px 14px rgba(0, 0, 0, .2); }

.stats { display: grid; gap: 2px; padding: 8px; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 8px; row-gap: 7px;
  width: 100%; padding: 9px 10px 10px; border-radius: 12px; border: 1px solid transparent; background: transparent; text-align: left;
  transition: background .25s, border-color .25s, transform .25s var(--ease), opacity .3s;
}
.lbl { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lbl small { font-size: 11px; opacity: .75; margin-left: 3px; }
.low { font-style: normal; font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 5px; vertical-align: 1px; }
.val { font-family: var(--f-data); font-weight: 600; font-size: 14.5px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.track { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; width: var(--p); border-radius: inherit; background: color-mix(in srgb, var(--ink) 28%, transparent); transform-origin: left; animation: grow .7s var(--ease) both; animation-delay: calc(var(--n, 0) * 50ms + 150ms); }
@keyframes grow { from { transform: scaleX(0); } }
.card.you .track i { background: color-mix(in srgb, var(--accent) 70%, transparent); }
.card.them .track i { background: color-mix(in srgb, var(--them) 80%, transparent); }

button.row { cursor: pointer; }
button.row:disabled { cursor: default; }
button.row:not(:disabled):hover { background: var(--surface-2); border-color: var(--line); transform: translateX(2px); }
button.row:not(:disabled):hover .track i { background: var(--accent); }
button.row:not(:disabled):active { transform: scale(.985); }
.stats.prompt button.row { animation: nudge 1.1s ease both; animation-delay: calc(var(--n) * 70ms + 300ms); }
@keyframes nudge { 0%, 100% { background: transparent; } 35% { background: var(--accent-soft); } }

.row.picked { background: var(--surface-2); border-color: var(--line-strong); }
.stats.decided .row:not(.picked) { opacity: .45; }
.row.win { background: var(--win-soft); border-color: color-mix(in srgb, var(--win) 40%, transparent); }
.row.win .val, .row.win .lbl { color: var(--win); }
.row.win .track i { background: var(--win); }
.row.lose { background: var(--lose-soft); border-color: color-mix(in srgb, var(--lose) 35%, transparent); }
.row.lose .val, .row.lose .lbl { color: var(--lose); }
.row.lose .track i { background: var(--lose); }
.row.draw { background: var(--draw-soft); border-color: color-mix(in srgb, var(--draw) 40%, transparent); }
.row.draw .val, .row.draw .lbl { color: var(--draw); }
.row.draw .track i { background: var(--draw); }
.card.dim { opacity: .66; transform: scale(.975); }

/* Card back */
.card-back {
  height: 100%; border-radius: 20px; position: relative; overflow: hidden; display: grid; place-items: center; box-shadow: var(--shadow);
  background:
    radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--them) 45%, transparent), transparent 70%),
    repeating-linear-gradient(135deg, rgba(255, 255, 255, .045) 0 2px, transparent 2px 11px),
    var(--back);
  border: 1px solid rgba(255, 255, 255, .06);
}
.card-back::before { content: ""; position: absolute; inset: 10px; border-radius: 13px; border: 1px solid rgba(255, 255, 255, .1); }
.back-mark { display: grid; justify-items: center; gap: 12px; color: rgba(255, 255, 255, .9); text-align: center; padding: 0 10px; }
.back-mark .brand-mark { transform: scale(1.5); }
.back-mark span { font-size: 12px; font-weight: 500; color: rgba(255, 255, 255, .72); min-height: 1.5em; }
.card-back.thinking::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, .1) 50%, transparent 70%); transform: translateX(-100%); animation: sheen 1.6s ease-in-out infinite; }
@keyframes sheen { to { transform: translateX(100%); } }
.dots i { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: currentColor; margin-left: 3px; animation: blink 1.2s infinite both; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* ---------- Lobby ---------- */
.lobby { display: grid; grid-template-columns: minmax(0, 1fr); gap: 30px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; }
.hero h1 { margin: 10px 0 12px; font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 5.4vw, 40px); line-height: 1.05; letter-spacing: -.035em; text-wrap: balance; }
.hero h1 span { color: var(--accent); }
.hero .sub { margin: 0; color: var(--muted); max-width: 40ch; font-size: 15.5px; }
.fan {
  position: relative; height: 360px; overflow-x: visible; overflow-y: clip;
  -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 98%); mask-image: linear-gradient(to bottom, #000 62%, transparent 98%);
}
.fan .card { position: absolute; width: 190px; top: 26px; left: 50%; pointer-events: none; }
.fan .card .track i { animation: none; }
.fan .f1 { transform: translateX(-84%) rotate(-8deg); animation: float1 7s ease-in-out infinite; }
.fan .f2 { transform: translateX(-14%) rotate(7deg) translateY(22px); animation: float2 7s ease-in-out infinite; }
@keyframes float1 { 50% { transform: translateX(-84%) rotate(-6.5deg) translateY(-6px); } }
@keyframes float2 { 50% { transform: translateX(-14%) rotate(8.5deg) translateY(16px); } }

.setup { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.section-title { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.friend { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 10px; max-width: 380px; transition: border-color .2s, box-shadow .2s; }
.friend:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.friend input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; font-weight: 500; padding: 6px 2px; }
.friend .hint { font-size: 12px; color: var(--muted); padding-right: 8px; white-space: nowrap; }

.decks { display: grid; gap: 12px; }
.tile {
  display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; align-items: center; gap: 16px; text-align: left;
  padding: 10px 16px 10px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); cursor: pointer;
  transition: transform .25s var(--ease), box-shadow .25s, border-color .25s;
}
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--line-strong); }
.tile:active { transform: translateY(0) scale(.99); }
.tile .art { aspect-ratio: 4 / 3; border-radius: 13px; padding: 0; }
.tile .art .num { font-size: 72px; bottom: -16px; right: -2px; opacity: .2; }
.tile-body { display: grid; gap: 3px; min-width: 0; }
.tile-body b { font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
.tile-body span { color: var(--muted); font-size: 13.5px; }
.tile-body .stat-list { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.go { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); transition: background .25s, color .25s, transform .25s var(--ease); }
.go svg { width: 16px; height: 16px; }
.tile:hover .go { background: var(--accent); color: var(--accent-ink); border-color: transparent; transform: translateX(2px); }

.how { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: step; }
.how li { counter-increment: step; display: grid; gap: 4px; padding: 14px; border-radius: 16px; background: color-mix(in srgb, var(--surface) 55%, transparent); border: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
.how li::before { content: counter(step); font-family: var(--f-data); font-size: 12px; font-weight: 600; color: var(--accent); }
.how li b { color: var(--ink); font-weight: 600; font-size: 14px; }
.note { margin: 0; font-size: 12px; color: var(--muted); }

/* ---------- Duel ---------- */
.game, .over { width: 100%; max-width: 620px; margin-inline: auto; }
.game { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.avatar svg { width: 18px; height: 18px; }
.game-top { display: flex; align-items: center; justify-content: space-between; }
.link { border: 0; background: none; padding: 6px 2px; cursor: pointer; color: var(--muted); font-size: 13.5px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.link:hover { color: var(--ink); }
.link svg { width: 15px; height: 15px; }
.deck-label { font-size: 12.5px; font-weight: 600; color: var(--muted); }

.scoreboard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px 16px; display: grid; gap: 14px; }
.players { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
.player { display: flex; align-items: center; gap: 10px; min-width: 0; }
.player.them { flex-direction: row-reverse; text-align: right; }
.av-wrap { position: relative; width: 38px; height: 38px; flex: none; }
.av-wrap .avatar { width: 100%; height: 100%; }
.ring { position: absolute; left: -6px; top: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg); pointer-events: none; opacity: 0; transition: opacity .35s; }
.player.active .ring { opacity: 1; }
.ring circle { fill: none; stroke-width: 2.6; stroke-linecap: round; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-dasharray: 100; stroke-dashoffset: 0; transition: stroke .3s; }
.player.them .ring .fg { stroke: var(--them); }
.ring.urgent .fg { stroke: var(--lose); }
.player.active .ring.urgent { animation: tick 1s ease-in-out infinite; }
@keyframes tick { 50% { transform: rotate(-90deg) scale(1.08); } }
.pinfo { display: grid; min-width: 0; line-height: 1.25; }
.pinfo b { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcount { font-size: 12.5px; color: var(--muted); }
.pcount span { font-family: var(--f-data); font-weight: 600; color: var(--ink); display: inline-block; font-variant-numeric: tabular-nums; }
.pcount span.bump { animation: bump .5s var(--ease); }
.pcount i.pl { font-style: normal; }
@keyframes bump { 40% { transform: scale(1.45); color: var(--accent); } }
.round { text-align: center; display: grid; justify-items: center; gap: 2px; }
.round small { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.round b { font-family: var(--f-display); font-weight: 600; font-size: 20px; line-height: 1; letter-spacing: -.02em; }
.pot { font-size: 11px; font-weight: 600; color: var(--draw); background: var(--draw-soft); padding: 2px 8px; border-radius: 999px; margin-top: 4px; }
.tug { position: relative; height: 6px; border-radius: 3px; background: var(--them-soft); overflow: hidden; }
.tug i { position: absolute; inset: 0 auto 0 0; width: 50%; background: var(--accent); border-radius: inherit; transition: width .7s var(--ease); }

.status { display: flex; justify-content: center; min-height: 40px; }
.pill { display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 500; max-width: 100%; animation: pillIn .35s var(--ease) both; text-align: center; }
.pill b { font-weight: 650; }
.pill .sep { color: var(--muted); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.pill.turn .dot { background: var(--accent); animation: pulse 1.6s ease-out infinite; }
.pill.wait .dot { background: var(--them); }
.pill.win { background: var(--win-soft); border-color: transparent; color: var(--win); } .pill.win .dot { background: var(--win); }
.pill.lose { background: var(--lose-soft); border-color: transparent; color: var(--lose); } .pill.lose .dot { background: var(--lose); }

.setup-row { display: flex; flex-wrap: wrap; gap: 22px 28px; align-items: flex-end; }

.table { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; container-type: inline-size; }

.vs { position: absolute; left: 50%; top: calc(15.6cqw - 18px); width: 36px; height: 36px; margin-left: -18px; z-index: 3; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-family: var(--f-display); font-weight: 700; font-size: 10.5px; letter-spacing: .02em; transition: opacity .3s, transform .4s var(--ease); }

.actions { display: flex; justify-content: center; align-items: center; gap: 12px; min-height: 50px; flex-wrap: wrap; }

.kbd kbd { font-family: var(--f-data); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--surface); }

.history { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.history summary { cursor: pointer; padding: 12px 16px; font-size: 13.5px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.history summary::-webkit-details-marker { display: none; }
.history summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px); transition: transform .25s var(--ease); }
.history[open] summary::after { transform: rotate(-135deg) translateY(-2px); }
.history ol { list-style: none; margin: 0; padding: 0 8px 8px; display: grid; gap: 2px; max-height: 240px; overflow-y: auto; }

.res.win { color: var(--win); background: var(--win-soft); } .res.lose { color: var(--lose); background: var(--lose-soft); } .res.draw { color: var(--draw); background: var(--draw-soft); }

/* ---------- Game over ---------- */
.over { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.result { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 34px 20px 26px; display: grid; justify-items: center; gap: 14px; text-align: center; box-shadow: var(--shadow); }
.result::before { content: ""; position: absolute; inset: -40% -20% auto; height: 120%; background: radial-gradient(closest-side, color-mix(in srgb, var(--glow, var(--accent)) 22%, transparent), transparent); z-index: 0; animation: glow 4s ease-in-out infinite alternate; will-change: transform, opacity; pointer-events: none; }

.final .dash { color: var(--muted); font-size: 22px; }

.result .actions { margin-top: 6px; }

@media (prefers-reduced-motion: reduce) {

    let out = "";
    for (const s of [-1, 1]) {
      out += `<polygon points="${pts(s)}" fill="${c.coat}" stroke="${c.coat}" stroke-width="5" stroke-linejoin="round"/>`;
      out += `<polygon points="${inner(s)}" fill="${shade(c.dark, .25)}" opacity=".55" stroke-linejoin="round"/>`;
      if (tuft) out += `<path d="M${cx + s * tipX},${cy - tipY + 2} q${s * 2},-9 ${s * -1},-17" stroke="${c.dark}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
    }
    return out;
  };
  if (c.ears === "small") ears = [-1, 1].map(s => `<circle cx="${cx + s * w * .7}" cy="${cy - h * .78}" r="10" fill="${c.coat}"/><circle cx="${cx + s * w * .7}" cy="${cy - h * .76}" r="5.5" fill="${shade(c.dark, .2)}" opacity=".5"/>`).join("");
  else if (c.ears === "low") ears = [-1, 1].map(s => `<ellipse cx="${cx + s * w * .86}" cy="${cy - h * .5}" rx="9" ry="7" fill="${c.coat}"/><ellipse cx="${cx + s * w * .86}" cy="${cy - h * .48}" rx="4.5" ry="3.5" fill="${shade(c.dark, .3)}" opacity=".5"/>`).join("");
  else if (c.ears === "big") ears = ear(w * .82, h * 1.95, w * .2, w * .92, false);
  else if (c.ears === "bigtufted") ears = ear(w * .8, h * 2.0, w * .2, w * .9, true);
  else if (c.ears === "tufted") ears = ear(w * .78, h * 1.55, w * .25, w * .9, true);
  else ears = ear(w * .74, h * 1.45, w * .25, w * .88, false);

  const headPath = `M${cx - w},${cy - 4} C${cx - w},${cy - h * 1.05} ${cx + w},${cy - h * 1.05} ${cx + w},${cy - 4} C${cx + w * 1.12},${cy + h * .55} ${cx + w * .55},${cy + h * 1.02} ${cx},${cy + h * 1.02} C${cx - w * .55},${cy + h * 1.02} ${cx - w * 1.12},${cy + h * .55} ${cx - w},${cy - 4} Z`;
  let pattern = "";
  const dots = (n, rMin, rMax, kind) => {
    let o = "";
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()), x = cx + Math.cos(a) * w * .95 * d, y = cy - 4 + Math.sin(a) * h * .95 * d;
      if (Math.abs(x - cx) < w * .42 && y > cy - 6) continue; // keep the face clear
      const r = rMin + rnd() * (rMax - rMin);
      o += kind === "ring" ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${shade(c.coat, -.08)}" stroke="${c.dark}" stroke-width="1.6" stroke-dasharray="${(r * 1.4).toFixed(1)} ${(r * .5).toFixed(1)}"/>`
        : kind === "blob" ? `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(r * 1.6).toFixed(1)}" ry="${r.toFixed(1)}" fill="${shade(c.dark, .18)}" opacity=".55" stroke="${c.dark}" stroke-width="1.2" transform="rotate(${Math.round(rnd() * 60 - 30)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`
        : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${c.dark}" opacity="${kind === "faint" ? .35 : .85}"/>`;
    }
    return o;
  };
  if (c.pattern === "spots") pattern = dots(46, 1.2, 2.4, "dot");
  if (c.pattern === "freckles") pattern = dots(40, .9, 1.6, "faint");
  if (c.pattern === "rosettes") pattern = dots(30, 2.4, 3.8, "ring");
  if (c.pattern === "clouds") pattern = dots(14, 3.5, 5.5, "blob");
  if (c.pattern === "stripes") {
    for (const s of [-1, 1]) for (let i = 0; i < 4; i++) {
      const y = cy - h * .55 + i * 9;
      pattern += `<path d="M${cx + s * (w + 2)},${y} q${-s * 12},${3 + i} ${-s * (16 + i * 2)},${8 + i * 2} q${s * 6},-1 ${s * 10},-5" fill="${c.dark}" opacity=".9"/>`;
    }
    pattern += `<path d="M${cx - 8},${cy - h * .82} q8,7 16,0 M${cx - 5},${cy - h * .66} q5,5 10,0" stroke="${c.dark}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  if (c.pattern === "bars") pattern = `<path d="M${cx - 10},${cy - h * .75} q10,5 20,0 M${cx - 13},${cy - h * .6} q13,6 26,0" stroke="${c.dark}" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".7"/>`;
  if (c.sides) pattern += [-1, 1].map(s => `<path d="M${cx + s * 11},${cy + 10} q${s * 8},4 ${s * 12},14" stroke="${c.dark}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>`).join("");
  if (c.tear) pattern += [-1, 1].map(s => `<path d="M${cx + s * 9},${cy - 2} q${s * 2},9 ${s * 5},17" stroke="${c.dark}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`).join("");

  const eyes = [-1, 1].map(s => {
    const ex = cx + s * w * .38, ey = cy - 5;
    return `<path d="M${ex - 7},${ey} Q${ex},${ey - 6.5} ${ex + 7},${ey} Q${ex},${ey + 5} ${ex - 7},${ey} Z" fill="${c.eye}" stroke="${c.dark}" stroke-width="1.4"/>` +
      (c.ears === "low" ? `<circle cx="${ex}" cy="${ey - .3}" r="2.6" fill="#111"/>` : `<ellipse cx="${ex}" cy="${ey - .3}" rx="1.5" ry="3.9" fill="#111"/>`) +
      `<circle cx="${ex + 2.2}" cy="${ey - 2}" r="1" fill="#fff" opacity=".9"/>`;
  }).join("");
  const mane = c.mane ? `<g>${Array.from({ length: 16 }, (_, i) => { const a = i / 16 * Math.PI * 2; return `<circle cx="${(cx + Math.cos(a) * w * 1.35).toFixed(1)}" cy="${(cy + 4 + Math.sin(a) * h * 1.45).toFixed(1)}" r="15" fill="${i % 2 ? c.mane : shade(c.mane, .07)}"/>`; }).join("")}<ellipse cx="${cx}" cy="${cy + 4}" rx="${w * 1.38}" ry="${h * 1.5}" fill="${c.mane}"/></g>` : "";
  const ruff = c.ruff ? [-1, 1].map(s => `<path d="M${cx + s * w * .8},${cy + 6} l${s * 12},6 l${-s * 6},2 l${s * 9},7 l${-s * 9},1 l${s * 3},6 l${-s * 14},-6 Z" fill="${shade(c.muzzle, -.05)}"/>`).join("") : "";
  return `<svg class="illus" viewBox="0 0 200 125" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="${headPath}"/></clipPath></defs>
    <g transform="translate(${(152 - cx * 1.22).toFixed(1)} ${(82 - cy * 1.22).toFixed(1)}) scale(1.22)">
    ${mane}${ears}${ruff}
    <path d="${headPath}" fill="${c.coat}"/>
    <g clip-path="url(#${id})">${pattern}<ellipse cx="${cx}" cy="${cy - h * .9}" rx="${w * .9}" ry="${h * .5}" fill="#fff" opacity=".08"/></g>
    <ellipse cx="${cx - 7.5}" cy="${cy + 14}" rx="10" ry="8" fill="${c.muzzle}"/><ellipse cx="${cx + 7.5}" cy="${cy + 14}" rx="10" ry="8" fill="${c.muzzle}"/>
    <ellipse cx="${cx}" cy="${cy + 22}" rx="7" ry="5" fill="${c.muzzle}"/>
    ${eyes}
    <path d="M${cx - 5},${cy + 6} L${cx + 5},${cy + 6} L${cx},${cy + 11} Z" fill="${shade(c.dark, .32)}" stroke="${c.dark}" stroke-width="1" stroke-linejoin="round"/>
    <path d="M${cx},${cy + 11} v3 M${cx},${cy + 14} q-4,3 -7,1 M${cx},${cy + 14} q4,3 7,1" stroke="${c.dark}" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    ${[-1, 1].map(s => [0, 1, 2].map(i => `<circle cx="${cx + s * (6 + i * 3.4)}" cy="${cy + 14 + (i % 2) * 2.5}" r=".8" fill="${c.dark}" opacity=".7"/>`).join("")).join("")}
    </g>
  </svg>`;
}

function carSVG(name, idx) {

}

  else if (p.kind === "rock") surface = Array.from({ length: 7 }, () => { const a = rnd() * 6.28, d = rnd() * r * .7, cr = r * (.08 + rnd() * .14); return `<circle cx="${(cx + Math.cos(a) * d).toFixed(1)}" cy="${(cy + Math.sin(a) * d).toFixed(1)}" r="${cr.toFixed(1)}" fill="#000" opacity=".16"/><circle cx="${(cx + Math.cos(a) * d - cr * .25).toFixed(1)}" cy="${(cy + Math.sin(a) * d - cr * .25).toFixed(1)}" r="${(cr * .7).toFixed(1)}" fill="#fff" opacity=".07"/>`; }).join("");

  const star = (x, y, r, rot = 0) => { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / 5, rr = i % 2 ? r * .4 : r; pts.push((x + Math.cos(a) * rr).toFixed(2) + "," + (y + Math.sin(a) * rr).toFixed(2)); } return `<polygon points="${pts.join(" ")}" fill="#ffde00"/>`; };

/* The group deck screen */
async function openDraft(id, opts = {}) {
  leaveGame();
  G = { id, mine: {}, pend: {}, chan: null, form: null, invite: !!opts.invite, welcome: !!opts.welcome };
  app.innerHTML = `<div class="loading view"><span>Loading group deck…</span></div>`;
  await loadDraft();
  if (!G || G.id !== id) return;
  if (!G.d || G.d.status !== "open") { toast("That group deck isn't available any more"); G = null; return home(); }
  const ch = (table, filter) => ({ event: "*", schema: "public", table, filter });
  G.chan = sb.channel("draft-" + id)
    .on("postgres_changes", ch("draft_cards", `draft_id=eq.${id}`), scheduleDraftReload)
    .on("postgres_changes", ch("draft_ratings", `draft_id=eq.${id}`), scheduleDraftReload)
    .on("postgres_changes", ch("draft_members", `draft_id=eq.${id}`), scheduleDraftReload)
    .on("postgres_changes", ch("drafts", `id=eq.${id}`), scheduleDraftReload)
    .subscribe();
  document.title = G.d.name + " · StatAttack";
  renderDraft();
}
async function loadDraft() {
  const id = G.id;
  const [d, m, c, r] = await Promise.all([
    sb.from("drafts").select("*").eq("id", id).maybeSingle(),
    sb.from("draft_members").select("*").eq("draft_id", id).eq("active", true),
    sb.from("draft_cards").select("*").eq("draft_id", id).eq("removed", false).order("created_at"),
    sb.from("draft_ratings").select("*").eq("draft_id", id)
  ]);
  if (!G || G.id !== id) return;
  G.d = d.data || null; G.members = m.data || []; G.cards = c.data || [];
  G.ratings = (r.data || []).map(x => ({ ...x, vals: x.vals.map(v => v == null ? null : Number(v)) }));
  // keep ratings you've just made that haven't reached the server yet
  Object.entries(G.mine).forEach(([cid, vals]) => upsertLocal(cid, vals));
  await loadNames([...G.members.map(x => x.user_id), ...G.cards.map(x => x.added_by), ...G.cards.map(x => x.subject).filter(Boolean)]);
}
function leaveDraft() {
  if (!G) return;
  Object.keys(G.pend).forEach(cid => { clearTimeout(G.pend[cid]); saveRating(cid); });
  if (G.notifyT) { clearTimeout(G.notifyT); notifyGroup(G.id, "cards"); }
  if (G.chan) sb.removeChannel(G.chan);
  clearTimeout(gTimer); G = null;
}
const draftSig = () => JSON.stringify([G.d.name, G.d.blurb, G.d.hue, G.d.stats, G.d.deck_key, G.d.status, G.members.map(m => m.user_id), G.cards.map(c => [c.id, c.name, c.image_url, c.place_id, c.subject])]);
function scheduleDraftReload() {
  clearTimeout(gTimer);
  gTimer = setTimeout(async () => {
    if (!G || !G.d) return;
    const before = draftSig();
    await loadDraft();
    if (!G || !$("rateTrack")) return;
    if (!G.d || G.d.status !== "open") { toast("This group deck was closed"); G = null; return home(); }
    if (draftSig() !== before && !(document.activeElement && document.activeElement.matches && document.activeElement.matches("#rateTrack input, #addPanel input, #placesPanel input"))) renderDraft(true);
    else patchDraft();

}
function upsertLocal(cid, vals) {
  const row = G.ratings.find(r => r.card_id === cid && r.user_id === me);
  if (row) row.vals = vals.slice(); else G.ratings.push({ card_id: cid, draft_id: G.id, user_id: me, vals: vals.slice() });
}
const gStats = () => G.d.stats;
const isDraftOwner = () => G.d.owner === me;
const myVals = cid => { const r = G.ratings.find(x => x.card_id === cid && x.user_id === me); return r ? r.vals.slice() : gStats().map(() => null); };
function cardAvg(c, j) {
  const rs = G.ratings.filter(r => r.card_id === c.id && r.user_id !== c.subject && r.vals[j] != null);
  return rs.length ? { avg: rs.reduce((a, r) => a + r.vals[j], 0) / rs.length, n: rs.length } : { avg: null, n: 0 };
}
const ratable = () => G.cards.filter(c => c.subject !== me);

  return out;

  let lat = +area.lat, lon = +area.lon;
  const [s, n, w, e] = area.boundingbox.map(Number);
  let hLat = Math.min(.03, Math.max(.012, (n - s) / 2)), hLon = Math.min(.046, Math.max(.018, (e - w) / 2));

    if (dir === "east") lon += bigLon; if (dir === "west") lon -= bigLon;

  const viewbox = [lon - hLon, lat + hLat, lon + hLon, lat - hLat].join(",");
  const res = await osmGet({ q: kind.q, limit: 40, bounded: 1, viewbox });
  const seen = new Set();
  const results = res.filter(x => x.name && kind.types.includes(x.type) && !seen.has(x.name.toLowerCase()) && seen.add(x.name.toLowerCase()));
  const cap = t => t.replace(/\b\w/g, c => c.toUpperCase());
  // nearest the middle first
  const dist = x => (x.lat - lat) ** 2 + ((x.lon - lon) * Math.cos(lat * Math.PI / 180)) ** 2;
  results.sort((a, b) => dist(a) - dist(b));

}

    const h = Math.sin(dLa / 2) ** 2 + Math.cos(centre[0] * Math.PI / 180) * Math.cos(x.lat * Math.PI / 180) * Math.sin(dLo / 2) ** 2;
    bits.push((2 * R * Math.asin(Math.sqrt(h))).toFixed(1) + " km away");
  }

}

/* ---------- Boot ---------- */
async function boot() {
  app.innerHTML = `<div class="loading view"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span>Connecting…</span></div>`;
  if (!window.supabase) return goOffline("The online service didn't load. Check your connection and refresh to play friends.");
  readAuthReturn();
  const openId = new URLSearchParams(location.search).get("game"), openDraftId = new URLSearchParams(location.search).get("draft");
  if (openId || openDraftId) history.replaceState(null, "", location.pathname + location.hash);
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let session = null;
  try { ({ data: { session } } = await sb.auth.getSession()); } catch (e) {}
  if (!session) {
    const { data, error } = await sb.auth.signInAnonymously();
    if (error) return goOffline(/anonymous/i.test(error.message)
      ? `Guest sign-in is switched off. In Supabase, open <b>Authentication → Sign In / Providers</b> and turn on <code>Allow anonymous sign-ins</code>, then refresh.`
      : esc(error.message));
    session = data.session;
  }
  me = session.user.id;
  isGuest = !!session.user.is_anonymous;
  myEmail = session.user.email || (session.user.user_metadata && session.user.user_metadata.email) || "";
  sb.auth.onAuthStateChange((event, s) => {
    // a different account (signed in elsewhere in this browser, or switched) reloads the app as that player
    if (s && s.user && s.user.id !== me) { location.replace(APP_URL); return; }
    if (s && s.user && event === "USER_UPDATED") {
      const wasGuest = isGuest; isGuest = !!s.user.is_anonymous; myEmail = s.user.email || myEmail;
      if (wasGuest !== isGuest && $("acct")) rerenderAccount();
    }
  });
  try { await loadDecks(); } catch (e) { return goOffline(esc(errMsg(e))); }
  const { data: p } = await sb.from("profiles").select("display_name").eq("id", me).maybeSingle();
  myName = p?.display_name || ""; if (myName) names[me] = myName;
  if (!myName && !isGuest && session.user.user_metadata && session.user.user_metadata.full_name) await saveName(String(session.user.user_metadata.full_name).split(" ")[0]);
  if (openId && /^[0-9a-f-]{36}$/i.test(openId)) return openGame(openId);
  if (openDraftId && /^[0-9a-f-]{36}$/i.test(openDraftId)) return openDraft(openDraftId);
  const code = (location.hash || "").slice(1).toUpperCase();
  if (/^DECK-[A-Z0-9]{6}$/.test(code)) {
    history.replaceState(null, "", location.pathname + location.search);
    if (myName) return joinDraftCode(code.slice(5));
    return home(code);
  }
  if (/^[A-Z0-9]{6}$/.test(code)) {
    history.replaceState(null, "", location.pathname + location.search);
    if (myName) return joinGame(code);
    return home(code);
  }
  home();
}
function goOffline(html) {
  offline = true; offlineReason = html;
  if (!Object.keys(DECKS).length) DECKS = LOCAL_DECKS;
  home();
}

async function renderGameList() {
  const list = $("games"); if (!list) return;
  const { data, error } = await sb.from("games").select("*").neq("status", "cancelled").order("updated_at", { ascending: false }).limit(25);
  if (error) { list.innerHTML = `<li class="empty">${esc(errMsg(error))}</li>`; return; }
  if (!data.length) { list.innerHTML = `<li class="empty">No games yet. Start one above and send your friends the link.</li>`; return; }
  const seatsOf = g => (g.players && g.players.length) ? g.players : [g.p1, g.p2].filter(Boolean);
  await loadNames(data.flatMap(seatsOf));
  if (data.some(g => !DECKS[g.deck_key])) { try { await loadDecks(); } catch (e) {} }
  if (!$("games")) return;
  $("games").innerHTML = data.map(g => {
    const S = seatsOf(g), si = S.indexOf(me), d = DECKS[g.deck_key], multi = S.length > 2 || (g.max_players || 2) > 2;
    const cnt = i => ((g.counts && g.counts.length) ? g.counts[i] : [g.p1_count, g.p2_count][i]) || 0;
    const others = S.filter(p => p !== me), opp = others[0], host = S[0] === me;
    const nm = id => esc(names[id] || "Player");
    const vs = others.length === 1 ? `vs ${nm(opp)}` : `vs ${nm(others[0])}, ${nm(others[1])}${others.length > 2 ? ` +${others.length - 2}` : ""}`;
    const out = (g.out_players || []).includes(me);
    let badge, sub, title = vs;
    if (g.status === "waiting") {
      badge = ""; title = multi ? `${S.length} of ${g.max_players} players` : "New game";
      sub = `${esc(d?.name || "")} · code ${esc(g.code)} · ${multi && !host ? `waiting for ${nm(S[0])} to start` : "waiting"}`;
    } else if (g.status === "finished") {
      const won = g.winner === me, tie = !g.winner;
      badge = `<span class="badge ${won ? "won" : tie ? "" : "lost"}">${won ? "Won" : tie ? "Draw" : "Lost"}${g.forfeited_by || multi ? "" : ` ${cnt(si)}–${cnt(1 - si)}`}</span>`;
      sub = `${esc(d?.name || "")} · ${multi ? `${S.length} players · ${out ? "you forfeited" : "finished"}` : g.forfeited_by ? (g.forfeited_by === me ? "you forfeited" : "they forfeited") : "finished"}`;
    } else {
      const mine = g.turn === me, gone = multi && (out || cnt(si) === 0);
      badge = `<span class="badge ${mine ? "go" : ""}">${mine ? "Your turn" : gone ? "Out" : multi ? `${nm(g.turn)}'s turn` : "Their turn"}</span>`;
      sub = `${esc(d?.name || "")} · round ${g.round} · ${multi ? `${S.length} players · you have ${cnt(si)}` : `${cnt(si)}–${cnt(1 - si)} cards`}`;
    }
    const av = g.status === "waiting" && !multi ? "?" : multi ? String(S.length) : initial(names[opp]);
    const item = `<button type="button" class="game-item" data-g="${g.id}"><span class="avatar them${multi ? " group" : ""}">${av}</span><span class="gi-main"><b>${title}</b><small>${sub}</small></span>${badge}</button>`;
    if (g.status !== "waiting") return `<li>${item}</li>`;
    return host
      ? `<li class="gi-row">${item}<button type="button" class="gi-x" data-cancel="${g.id}" aria-label="Cancel this game">Cancel</button></li>`
      : `<li class="gi-row">${item}<button type="button" class="gi-x" data-leave="${g.id}" aria-label="Leave this game">Leave</button></li>`;
  }).join("");
  $("games").querySelectorAll("[data-g]").forEach(b => b.onclick = () => openGame(b.dataset.g));
  const sure = (b, label, fn) => b.onclick = async () => {
    if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Sure?"; setTimeout(() => { b.classList.remove("sure"); b.textContent = label; }, 3000); return; }
    b.disabled = true;
    const err = await fn();
    if (err) { b.disabled = false; return toast(errMsg(err)); }

async function shrinkPhoto(file) {
  if (!/^image\//.test(file.type || "image/")) throw new Error("That file isn't a photo.");
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error("That photo couldn't be read. Try a JPEG or PNG.")); img.src = url; });
    const max = 900, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", .84));
    if (!blob) throw new Error("That photo couldn't be read. Try a JPEG or PNG.");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
async function uploadPhoto(file) {
  const blob = await shrinkPhoto(file);
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  const path = `${me}/${id}.jpg`;
  const { error } = await sb.storage.from("card-images").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000", upsert: false });
  if (error) throw new Error(errMsg(error));
  return sb.storage.from("card-images").getPublicUrl(path).data.publicUrl;
}

async function saveDeck() {
  const p = problems();
  app.querySelectorAll("[aria-invalid]").forEach(el => el.removeAttribute("aria-invalid"));
  if (p.length) {
    E.tried = true; updateNeeds();
    p.forEach(x => { const el = app.querySelector(x.sel); if (el && el.tagName === "INPUT") el.setAttribute("aria-invalid", "true"); });
    toast(p[0].msg);
    const first = app.querySelector(p[0].sel); if (first) { first.focus({ preventScroll: true }); first.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" }); }
    return;
  }
  const btn = $("saveDeck"); btn.disabled = true; btn.firstChild.textContent = "Saving…";
  const payload = {
    key: E.key, name: E.name.trim(), blurb: E.blurb.trim(), hue: E.hue,
    stats: E.stats.map(s => ({ label: s.label.trim(), unit: s.unit.trim(), low: !!s.low })),
    cards: E.cards.map(c => ({ name: c.name.trim(), vals: E.stats.map((_, j) => parseNum(c.vals[j])), image: c.image && c.image.startsWith(PHOTO_PREFIX) ? c.image : null, place: c.image ? null : (c.place || null) }))
  };
  const { data: newKey, error } = await sb.rpc("save_deck", { p_deck: payload });
  if (error) { btn.disabled = false; btn.firstChild.textContent = E.key ? "Save changes" : "Save deck"; return toast(errMsg(error)); }
  const wasEditing = !!E.key;
  clearTimeout(draftTimer);
  clearDraft(E.key);
  E = null;
  try { await loadDecks(); } catch (e) {}
  toast(wasEditing ? "Changes saved" : "Deck saved. Pick it under Start a game.");
  await home();
  const pane = $("myDecks"); if (pane) pane.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
  const tile = app.querySelector(`[data-deck="${newKey}"]`); if (tile) tile.classList.add("fresh");
}

/* ---------- Game ---------- */
function leaveGame() {
  if (typeof stopPractice === "function" && P) stopPractice();
  if (typeof leaveDraft === "function") leaveDraft();
  if (typeof E !== "undefined" && E) { clearTimeout(draftTimer); persistDraft(); E = null; }
  if (gameChan) { sb.removeChannel(gameChan); gameChan = null; }
  if (homeChan) { sb.removeChannel(homeChan); homeChan = null; }
  clearInterval(tick); tick = 0; gameId = null; V = null; L = null; PS = null; renderedKey = ""; queue = []; skipped = 0;
}
async function openGame(id) {
  leaveGame();
  gameId = id;
  app.innerHTML = `<div class="loading view"><span>Loading game…</span></div>`;
  gameChan = sb.channel("game-" + id)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "games", filter: `id=eq.${id}` }, () => refresh())
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "rounds", filter: `game_id=eq.${id}` }, () => refresh())
    .subscribe();
  await refresh();
  tick = setInterval(clock, 250);
}

let refreshing = false, refreshAgain = false;
async function refresh() {
  if (isLocal()) return localRefresh();
  if (!gameId) return;
  if (refreshing) { refreshAgain = true; return; }
  refreshing = true;
  const id = gameId;
  const { data, error } = await sb.rpc("game_view", { p_game: id });
  if (id !== gameId) { refreshing = false; return; }
  if (error) { refreshing = false; toast(errMsg(error)); return home(); }
  if (!DECKS[data.game.deck_key]) { try { await loadDecks(); } catch (e) {} }
  if (id !== gameId) { refreshing = false; return; }
  V = data;
  clockOffset = Date.parse(data.server_now) - Date.now();
  const g = V.game;
  await loadNames(seats());
  if (!queue.length) {
    const seen = Number(store.get("sa-seen-" + id) || 0);
    const { data: rounds } = await sb.from("rounds").select("*").eq("game_id", id).gt("round", seen).order("round");
    if (id !== gameId) { refreshing = false; return; }
    if (rounds && rounds.length) { queue = [normRound(rounds[rounds.length - 1])]; skipped = rounds.length - 1; }
  }
  refreshing = false;
  render();
  if (refreshAgain) { refreshAgain = false; refresh(); }
}

/* Seats: everyone in the game in turn order. 1v1 keeps the face-off layout; 3-6 players get the group table. */
const seats = () => (V.game.players && V.game.players.length) ? V.game.players : [V.game.p1, V.game.p2].filter(Boolean);
const mySeat = () => seats().indexOf(me);
const countAt = i => { const g = V.game; return ((g.counts && g.counts.length) ? g.counts[i] : [g.p1_count, g.p2_count][i]) || 0; };
const isMulti = () => seats().length > 2;
const amOut = () => countAt(mySeat()) === 0 || (V.game.out_players || []).includes(me);
const SEAT_COLORS = ["#5d6f96", "#2f8f83", "#9a5bc4", "#c0793a", "#c2457a", "#4a8bd6"];
const seatColor = i => SEAT_COLORS[i % SEAT_COLORS.length];
const oppId = () => seats().find(p => p !== me);
const myCount = () => countAt(mySeat());
const theirCount = () => countAt(seats().indexOf(oppId()));
// rounds played before group games only carry c1/c2
const normRound = r => r.cards ? r : { ...r, cards: [r.c1, r.c2], vals: [r.v1, r.v2], winner_seat: r.result === "p1" ? 0 : r.result === "p2" ? 1 : null };
const nameOf = id => esc(names[id] || "Player");

function topBar(d) {
  return `<div class="game-top"><button type="button" class="link" id="leave">${BACK}Games</button><span class="top-actions"><span class="deck-label">${esc(d.name)} · ${V.local ? `vs ${seats().length - 1} computers` : `${timerLabel(V.game.timer_secs)} turns`}</span>${amOut() && V.game.status === "active" ? "" : `<button type="button" class="link danger" id="forfeitBtn">Forfeit</button>`}</span></div>`;
}
function wireTop() { $("leave").onclick = () => home(); if ($("forfeitBtn")) $("forfeitBtn").onclick = forfeit; }

function shell(d) {
  if (isMulti()) return shellMulti(d);
  const opp = names[oppId()] || "Friend";
  return `
  <section class="game view">
    ${topBar(d)}
    <div class="scoreboard">
      <div class="players">
        <div class="player you" id="pYou"><span class="av-wrap"><span class="avatar">${ME}</span>${RING("ringYou")}</span><span class="pinfo"><b>You</b><span class="pcount"><span id="cYou">0</span> cards</span></span></div>
        <div class="round"><small>Round</small><b id="rnd">1</b><span class="pot" id="pot" hidden></span></div>
        <div class="player them" id="pThem"><span class="av-wrap"><span class="avatar them">${initial(opp)}</span>${RING("ringThem")}</span><span class="pinfo"><b>${esc(opp)}</b><span class="pcount"><span id="cThem">0</span> cards</span></span></div>
      </div>
      <div class="tug" aria-hidden="true"><i id="tug"></i></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="table" id="table"></div>
    <div class="actions" id="actions"></div>
  </section>`;
}
function shellMulti(d) {
  const chips = seats().map((id, i) => `
      <div class="pchip${id === me ? " you" : ""}" id="pc${i}" style="--them:${seatColor(i)}">
        <span class="av-wrap"><span class="avatar${id === me ? "" : " them"}">${id === me ? ME : initial(names[id])}</span>${RING("ring" + i)}</span>
        <span class="pinfo"><b>${id === me ? "You" : nameOf(id)}</b><span class="pcount"><span id="cnt${i}">0</span><i class="pl" id="pl${i}"> cards</i></span></span>
      </div>`).join("");
  return `
  <section class="game view multi">
    ${topBar(d)}
    <div class="scoreboard">
      <div class="pgrid n${seats().length}">${chips}</div>
      <div class="round-row"><span>Round <b id="rnd">1</b></span><span class="pot" id="pot" hidden></span><span class="share-bar" aria-hidden="true">${seats().map((id, i) => `<i id="sh${i}" style="--c:${id === me ? "var(--accent)" : seatColor(i)}"></i>`).join("")}</span></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="table multi" id="table"></div>
    <div class="actions" id="actions"></div>
  </section>`;
}
const timerLabel = s => (TIMERS.find(t => t.s === s) || { l: s >= 3600 ? Math.round(s / 3600) + "h" : s + "s" }).l;

// Inline confirm bar shown under the top row: no browser dialogs inside the game
function confirmBar(text, yesLabel, onYes, noLabel) {
  document.querySelectorAll(".confirm").forEach(c => c.remove());
  const bar = document.createElement("div");
  bar.className = "confirm"; bar.setAttribute("role", "alertdialog");
  bar.innerHTML = `<span>${text}</span><span class="actions"><button type="button" class="btn ghost small" data-no>${noLabel}</button><button type="button" class="btn danger small" data-yes>${yesLabel}</button></span>`;
  const top = document.querySelector(".game-top");
  top.insertAdjacentElement("afterend", bar);
  bar.querySelector("[data-no]").onclick = () => bar.remove();
  bar.querySelector("[data-yes]").onclick = async () => { bar.querySelectorAll("button").forEach(x => x.disabled = true); await onYes(); bar.remove(); };
  bar.querySelector("[data-no]").focus();
}
async function forfeit() {
  if (isLocal()) return confirmBar("Leave this practice game?", "Leave", async () => home(), "Keep playing");
  const alive = seats().filter((id, i) => id !== me && countAt(i) > 0);
  const text = alive.length > 1
    ? "Forfeit this game? Your cards go in the pot and everyone else plays on."
    : `Forfeit this game? ${esc(names[alive[0]] || "Your friend")} gets the win.`;
  confirmBar(text, "Forfeit", async () => {
    const { error } = await sb.rpc("forfeit_game", { p_game: gameId });
    if (error) return toast(errMsg(error));
    notifyOpponent(gameId);
    queue = []; renderedKey = ""; app.innerHTML = ""; refresh();
  }, "Keep playing");
}
function setStatus(kind, html, lead) {
  const el = $("status"); if (el) el.innerHTML = `<span class="pill ${kind}" id="pill">${lead || '<span class="dot"></span>'}<span>${html}</span></span>`;
}
const leadFor = id => `<span class="mini" style="--them:${seatColor(seats().indexOf(id))}">${initial(names[id])}</span>`;
function bumpSet(id, v) { const el = $(id); if (el && el.textContent !== String(v)) { el.textContent = v; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } }
function updateBoard() {
  const g = V.game, d = DECKS[g.deck_key], total = d.cards.length;
  const showTurn = !queue.length && g.status === "active";
  if ($("rnd")) $("rnd").textContent = queue.length ? queue[0].round : g.round;
  const pot = $("pot"); if (pot) { pot.hidden = !g.pot_count; pot.textContent = `Pot ${g.pot_count}`; }
  if (isMulti()) {
    const out = g.out_players || [];
    seats().forEach((id, i) => {
      bumpSet("cnt" + i, countAt(i));
      const pl = $("pl" + i); if (pl) pl.textContent = countAt(i) === 1 ? " card" : " cards";
      const chip = $("pc" + i); if (!chip) return;
      chip.classList.toggle("active", showTurn && g.turn === id);
      chip.classList.toggle("out", g.status !== "waiting" && (countAt(i) === 0 || out.includes(id)));
      const sh = $("sh" + i); if (sh) sh.style.flexGrow = countAt(i);
    });
    return;
  }
  bumpSet("cYou", myCount()); bumpSet("cThem", theirCount());
  if ($("tug")) $("tug").style.width = (myCount() / total * 100) + "%";
  $("pYou")?.classList.toggle("active", showTurn && g.turn === me);
  $("pThem")?.classList.toggle("active", showTurn && g.turn !== me);
}

function render() {
  if (!V) return;
  const g = V.game, d = DECKS[g.deck_key];
  const key = queue.length ? `reveal|${queue[0].round}` : `${g.status}|${g.round}|${g.turn}|${g.rematch_id || ""}|${seats().length}|${(g.out_players || []).length}`;
  if (key === renderedKey) { updateBoard(); return; }
  renderedKey = key;
  document.title = g.status === "active" && g.turn === me && !queue.length ? "Your turn · StatAttack" : "StatAttack";

  if (g.status === "cancelled") { toast("That game was cancelled"); return home(); }
  if (g.status === "waiting") return renderInvite(g);
  if (queue.length) return isMulti() ? renderRevealMulti(queue[0]) : renderReveal(queue[0]);
  if (g.status === "finished") return isMulti() ? renderOverMulti() : renderOver();

  // the top bar changes once you're out, so rebuild the shell then
  if (!$("table") || (!!$("forfeitBtn") === amOut())) { app.innerHTML = shell(d); wireTop(); }
  if (isMulti()) return renderTurnMulti(d);
  updateBoard();
  const opp = names[oppId()] || "Your friend";
  const yours = g.turn === me;
  $("table").className = "table";
  $("table").innerHTML = `
    <div class="slot you deal" id="sYou">${V.my_top != null ? cardHTML(d, card(d, V.my_top), "you", yours) : ""}</div>
    <div class="vs" aria-hidden="true">VS</div>
    <div class="slot them deal" id="sThem">${backHTML(yours ? "Face down" : `Picking<span class="dots"><i></i><i></i><i></i></span>`, !yours)}</div>`;
  $("actions").innerHTML = "";
  if (yours) {
    setStatus("turn", `<b>Your turn</b> <span class="sep">·</span> pick a stat <span class="secs" id="secs"></span>`);
    $("table").querySelectorAll("button.row").forEach(b => b.onclick = () => play(+b.dataset.i));
  } else {
    setStatus("wait", `<b>${esc(opp)}'s turn</b> <span class="sep">·</span> <span id="secsThem">picking a stat</span>`, `<span class="mini">${initial(opp)}</span>`);
    $("sYou").querySelector(".stats")?.classList.add("waiting");
  }
  clock();
}

/* Group table: your card, plus everyone else's face-down card */
const miniBack = thinking => `<div class="card-back mini-back${thinking ? " thinking" : ""}"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span></div>`;
const outHTML = () => `<div class="card-back out-back"><div class="back-mark"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span>You're out of cards.<br>Stay and watch how it ends.</span></div></div>`;
function miniHTML(d, c, si) {
  const pic = artFor(d, c), s = d.stats[si];
  return `<article class="mini-card"><div class="art mart${pic ? " has-illus" : ""}" style="--h:${hueOf(d, c.id)}">${pic}<span class="mstamp">Wins</span></div><div class="mbody"><b>${esc(c.name)}</b><span class="mval">${fmt(c.v[si])}<small>${esc(s.unit)}</small></span></div></article>`;
}
function oppHTML(i, id, inner) {
  return `<div class="opp${inner ? "" : " out"}" id="op${i}" style="--them:${seatColor(i)}"><div class="opp-card">${inner || `<div class="mini-out">Out</div>`}</div><span class="opp-name"><span class="avatar them sm">${initial(names[id])}</span><span>${nameOf(id)}</span></span></div>`;
}
function renderTurnMulti(d) {
  const g = V.game, yours = g.turn === me, out = amOut(), turnName = names[g.turn] || "Player";
  updateBoard();
  $("table").className = "table multi";
  $("table").innerHTML = `
    <div class="slot you deal" id="sYou">${!out && V.my_top != null ? cardHTML(d, card(d, V.my_top), "you", yours) : outHTML()}</div>
    <div class="opps n${seats().length - 1}" id="opps">${seats().map((id, i) => id === me ? "" : oppHTML(i, id, countAt(i) > 0 ? miniBack(g.turn === id) : "")).join("")}</div>`;
  $("actions").innerHTML = "";
  if (yours) {
    setStatus("turn", `<b>Your turn</b> <span class="sep">·</span> pick a stat <span class="secs" id="secs"></span>`);
    $("table").querySelectorAll("button.row").forEach(b => b.onclick = () => play(+b.dataset.i));
  } else if (out) {
    setStatus("wait", `<b>You're out</b> <span class="sep">·</span> ${esc(turnName)} is picking`, leadFor(g.turn));
  } else {
    setStatus("wait", `<b>${esc(turnName)}'s turn</b> <span class="sep">·</span> <span id="secsThem">picking a stat</span>`, leadFor(g.turn));
    $("sYou").querySelector(".stats")?.classList.add("waiting");
  }
  clock();
}

async function play(i) {
  if (busy || !V || V.game.turn !== me) return;
  busy = true;
  $("table").querySelectorAll("button.row").forEach(b => b.disabled = true);
  const row = $("sYou").querySelector(`[data-i="${i}"]`); row?.classList.add("picked");
  $("sYou").querySelector(".stats")?.classList.remove("prompt");
  setStatus("wait", `You played <b>${esc(DECKS[V.game.deck_key].stats[i].label)}</b>`);
  if (isLocal()) { localResolve(i, false); busy = false; return localRefresh(); }
  const { error } = await sb.rpc("play_stat", { p_game: gameId, p_stat: i });
  if (!error) notifyOpponent(gameId);
  busy = false;
  if (error) { toast(errMsg(error)); renderedKey = ""; return refresh(); }
  refresh();
}

function nextButton(r, res, over, label) {
  const g = V.game, thisRound = r.round;
  $("actions").innerHTML = `${skipped ? `<span class="skipped">${skipped} earlier round${skipped > 1 ? "s" : ""} played while you were away</span>` : ""}<button type="button" class="btn primary" id="next">${over ? "See result" : label}${ARROW}</button>`;
  $("next").focus({ preventScroll: true });
  // live games keep moving: the reveal advances on its own after a few seconds
  if (g.timer_secs <= 60) setTimeout(() => { if (queue.length && queue[0].round === thisRound) $("next")?.click(); }, reduceMotion ? 2500 : isMulti() ? 4600 : 3800);
  $("next").onclick = async () => {
    $("actions").innerHTML = "";
    $("table").classList.add(res === "win" ? "to-you" : res === "lose" ? "to-them" : "to-pot");
    store.set("sa-seen-" + gameId, String(Math.max(thisRound, Number(store.get("sa-seen-" + gameId) || 0))));
    await wait(450);
    queue = []; skipped = 0; renderedKey = "";
    refresh();
  };
}

async function renderReveal(r) {
  const g = V.game, d = DECKS[g.deck_key], s = d.stats[r.stat], opp = names[oppId()] || "Your friend";
  const my = mySeat(), ot = 1 - my;
  const mine = card(d, r.cards[my]), theirs = card(d, r.cards[ot]);
  const res = r.winner_seat == null ? "draw" : (r.winner_seat === my ? "win" : "lose");
  const byMe = r.by_player === me;
  if (!$("table")) { app.innerHTML = shell(d); wireTop(); }
  updateBoard();
  $("table").className = "table";
  $("table").innerHTML = `
    <div class="slot you deal" id="sYou">${cardHTML(d, mine, "you", false)}</div>
    <div class="vs" aria-hidden="true">VS</div>
    <div class="slot them deal" id="sThem"><div class="flipper">
      <div class="face back">${backHTML("Face down", false)}</div>
      <div class="face front">${cardHTML(d, theirs, "them", false)}</div>
    </div></div>`;
  $("actions").innerHTML = "";
  [$("sYou"), $("sThem")].forEach(sl => { const st = sl.querySelector(".front .stats") || sl.querySelector(".stats"); st.querySelector(`[data-i="${r.stat}"]`).classList.add("picked"); st.classList.add("decided"); });
  if (r.auto) setStatus("hurry", `<b>Time's up</b> <span class="sep">·</span> ${esc(s.label)} was played for ${byMe ? "you" : esc(opp)}`);
  else if (byMe) setStatus("wait", `You played <b>${esc(s.label)}</b>`);
  else setStatus("wait", `${esc(opp)} picked <b>${esc(s.label)}</b>`, `<span class="mini">${initial(opp)}</span>`);
  const thisRound = r.round;
  await wait(byMe ? 250 : 650);
  if (!queue.length || queue[0].round !== thisRound) return;
  $("sThem")?.classList.add("flipped");
  await wait(800);
  if (!queue.length || queue[0].round !== thisRound) return;
  const yRow = $("sYou").querySelector(`[data-i="${r.stat}"]`), tRow = $("sThem").querySelector(`.front [data-i="${r.stat}"]`);
  const yCard = $("sYou").querySelector(".card"), tCard = $("sThem").querySelector(".front .card");
  const a = fmt(Number(r.vals[my])), b = fmt(Number(r.vals[ot])), sep = `<span class="sep">·</span>`;
  if (res === "draw") { yRow.classList.add("draw"); tRow.classList.add("draw"); setStatus("draw", `<b>${esc(s.label)}</b> tied at ${a} ${sep} Both cards go in the pot`); }
  else {
    yRow.classList.add(res); tRow.classList.add(res === "win" ? "lose" : "win");
    (res === "win" ? yCard : tCard).classList.add("stamped"); (res === "win" ? tCard : yCard).classList.add("dim");
    setStatus(res, res === "win" ? `<b>${esc(s.label)}</b> ${a} v ${b} ${sep} You take ${esc(theirs.name)}` : `<b>${esc(s.label)}</b> ${a} v ${b} ${sep} ${esc(opp)} takes ${esc(mine.name)}`);
  }
  const over = g.status === "finished" && thisRound >= g.round - 1;
  nextButton(r, res, over, res === "win" || (res === "draw" && byMe) ? "Next round · you pick" : `Next round · ${esc(opp)} picks`);
}

async function renderRevealMulti(r) {
  const g = V.game, d = DECKS[g.deck_key], s = d.stats[r.stat], S = seats(), my = mySeat();
  const w = r.winner_seat, byMe = r.by_player === me, byName = names[r.by_player] || "Player";
  if (!$("table") || !$("pc0")) { app.innerHTML = shell(d); wireTop(); }
  updateBoard();
  const vals = r.vals.map(v => v == null ? null : Number(v));
  const played = vals.filter(v => v != null);
  const best = s.low ? Math.min(...played) : Math.max(...played);
  const myCard = r.cards[my] != null ? card(d, r.cards[my]) : null;
  $("table").className = "table multi";
  $("table").innerHTML = `
    <div class="slot you deal" id="sYou">${myCard ? cardHTML(d, myCard, "you", false) : outHTML()}</div>
    <div class="opps n${S.length - 1}" id="opps">${S.map((id, i) => id === me ? "" : oppHTML(i, id, r.cards[i] == null ? "" :
      `<div class="flipper"><div class="face back">${miniBack(false)}</div><div class="face front">${miniHTML(d, card(d, r.cards[i]), r.stat)}</div></div>`)).join("")}</div>`;
  $("actions").innerHTML = "";
  if (myCard) { const st = $("sYou").querySelector(".stats"); st.querySelector(`[data-i="${r.stat}"]`).classList.add("picked"); st.classList.add("decided"); }
  if (r.auto) setStatus("hurry", `<b>Time's up</b> <span class="sep">·</span> ${esc(s.label)} was played for ${byMe ? "you" : esc(byName)}`);
  else if (byMe) setStatus("wait", `You played <b>${esc(s.label)}</b>`);
  else setStatus("wait", `${esc(byName)} picked <b>${esc(s.label)}</b>`, leadFor(r.by_player));
  const thisRound = r.round, stale = () => !queue.length || queue[0].round !== thisRound;
  await wait(byMe ? 250 : 650);
  if (stale()) return;
  const flips = [...$("opps").querySelectorAll(".opp:not(.out) .opp-card")];
  flips.forEach((el, k) => setTimeout(() => el.classList.add("flipped"), reduceMotion ? 0 : k * 140));
  await wait(800 + flips.length * 140);
  if (stale()) return;
  S.forEach((id, i) => {
    if (vals[i] == null) return;
    const kind = w == null ? (vals[i] === best ? "draw" : "lose") : (i === w ? "win" : "lose");

function fmtLeft(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  if (s >= 3600) return Math.floor(s / 3600) + "h " + Math.floor(s % 3600 / 60) + "m";
  if (s >= 120) return Math.floor(s / 60) + "m";
  return s + "s";
}
function clock() {
  if (!V || queue.length || V.game.status !== "active" || !V.game.turn_deadline) return;
  const g = V.game, left = Date.parse(g.turn_deadline) - (Date.now() + clockOffset), dur = g.timer_secs * 1000;
  const frac = Math.max(0, Math.min(1, left / dur)), urgent = left <= 5000 && g.timer_secs <= 60;
  const ring = isMulti() ? $("ring" + seats().indexOf(g.turn)) : $(g.turn === me ? "ringYou" : "ringThem");
  if (ring) { ring.querySelector(".fg").style.strokeDashoffset = (100 * (1 - frac)).toFixed(2); ring.classList.toggle("urgent", urgent); }
  const secs = $("secs"); if (secs) secs.textContent = fmtLeft(left);
  const st = $("secsThem"); if (st) st.textContent = g.timer_secs > 60 ? `${fmtLeft(left)} to play` : "picking a stat";
  const pill = $("pill"); if (pill && g.turn === me) { pill.classList.toggle("hurry", urgent); pill.classList.toggle("turn", !urgent); }
  if (left < -400 && claimedFor !== g.turn_deadline) {
    claimedFor = g.turn_deadline;
    if (isLocal()) { if (L && L.g.status === "active") { localResolve(Math.floor(Math.random() * DECKS[g.deck_key].stats.length), true); localRefresh(); } return; }
    const gid = gameId;
    sb.rpc("claim_timeout", { p_game: gid }).then(() => { notifyOpponent(gid); refresh(); });
  }
}

const BOT_NAMES = ["Robo", "Pixel", "Byte", "Turbo", "Chip"];
let L = null;
const isLocal = () => gameId === "local";
function startGroupPractice(key, bots) {
  leaveGame();
  if (!me) me = "local-you";
  const d = DECKS[key], n = d.cards.length, players = [me, ...BOT_NAMES.slice(0, bots).map((_, i) => "bot-" + i)];
  players.forEach((id, i) => { if (i) names[id] = BOT_NAMES[i - 1]; });
  if (!names[me]) names[me] = myName || "You";
  const order = shuffle([...Array(n).keys()]);
  L = { key, bots, unseen: [], botFor: 0,
    h: { piles: players.map((_, s) => order.filter((_, k) => k % players.length === s)), pot: [] },
    g: { id: "local", deck_key: key, players, max_players: players.length, out_players: [], status: "active", round: 1, last_round: null, winner: null, rematch_id: null, forfeited_by: null,
      timer_secs: practiceSecs || 86400, turn: players[Math.floor(Math.random() * players.length)], turn_deadline: null, counts: [], pot_count: 0 } };
  localCounts(); localDeadline();
  gameId = "local"; queue = []; skipped = 0; renderedKey = "";
  app.innerHTML = "";
  localRefresh();
  tick = setInterval(clock, 250);
}
function localCounts() { const g = L.g, h = L.h; g.counts = h.piles.map(p => p.length); g.p1_count = g.counts[0]; g.p2_count = g.counts[1]; g.pot_count = h.pot.length; }
function localDeadline(extra = 0) { L.g.turn_deadline = practiceSecs && L.g.status === "active" ? new Date(Date.now() + practiceSecs * 1000 + extra).toISOString() : null; }
function localResolve(stat, auto) {
  const g = L.g, h = L.h, d = DECKS[g.deck_key], low = !!d.stats[stat].low;
  const cards = h.piles.map(p => p.length ? p.shift() : null), vals = cards.map(c => c == null ? null : d.cards[c][stat + 1]);
  const played = vals.filter(x => x != null), best = low ? Math.min(...played) : Math.max(...played);
  const w = vals.filter(x => x === best).length === 1 ? vals.indexOf(best) : null;
  const order = cards.map((c, i) => ({ c, i })).filter(x => x.c != null).sort((a, b) => (b.i === w) - (a.i === w) || a.i - b.i).map(x => x.c);
  if (w == null) h.pot.push(...order); else { h.piles[w].push(...order, ...h.pot); h.pot = []; }
  localCounts();
  const alive = g.counts.filter(c => c > 0).length, np = g.players.length, done = alive <= 1 || g.round >= 40 + 10 * (np - 2);
  let win = null, nxt = null;
  if (done) {
    if (alive === 1) { const ls = g.counts.findIndex(c => c > 0); win = g.players[ls]; h.piles[ls].push(...h.pot); h.pot = []; localCounts(); }
    else if (alive > 1) { const m = Math.max(...g.counts); if (g.counts.filter(c => c === m).length === 1) win = g.players[g.counts.indexOf(m)]; }
  } else if (w != null) nxt = g.players[w];
  else if (g.counts[g.players.indexOf(g.turn)] > 0) nxt = g.turn;
  else { const from = g.players.indexOf(g.turn); for (let k = 1; k <= np; k++) { const j = (from + k) % np; if (g.counts[j] > 0) { nxt = g.players[j]; break; } } }
  L.unseen.push({ game_id: "local", round: g.round, by_player: g.turn, stat, auto, cards, vals, winner_seat: w });
  Object.assign(g, { turn: done ? null : nxt, round: g.round + 1, status: done ? "finished" : "active", winner: win });

}
function localRefresh() {
  if (!L) return;
  const g = L.g, seat = g.players.indexOf(me);

    my_top: g.status === "active" && L.h.piles[seat].length ? L.h.piles[seat][0] : null, server_now: new Date().toISOString() };
  clockOffset = 0;
  if (!queue.length && L.unseen.length) { queue = [L.unseen[L.unseen.length - 1]]; skipped = L.unseen.length - 1; L.unseen = []; }
  render();

}
function localBotPick() {
  const g = L.g, d = DECKS[g.deck_key], c = d.cards[L.h.piles[g.players.indexOf(g.turn)][0]];
